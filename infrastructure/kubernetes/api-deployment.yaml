apiVersion: apps/v1
kind: Deployment
metadata:
  name: edusphere-api
  labels:
    app: edusphere-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: edusphere-api
  template:
    metadata:
      labels:
        app: edusphere-api
    spec:
      containers:
        - name: api
          image: edusphere/api-server:latest
          ports:
            - containerPort: 5000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "5000"
          envFrom:
            - secretRef:
                name: edusphere-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/me
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/me
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: edusphere-api-service
spec:
  selector:
    app: edusphere-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
  type: ClusterIP
